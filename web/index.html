<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Let It Ride</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #111310; }
  canvas { display: block; width: 100%; height: 100%; }
  #status { position: absolute; top: 16px; left: 16px; font: 16px system-ui; color: #e8e3d4; }
</style>
<body>
<div id="status" role="status">Loading Let It Ride…</div>
<script type="module">
  import init from './CasinoGame.js';
  try {
    if (!navigator.gpu) throw new Error('WebGPU is unavailable. Use a WebGPU-enabled browser over HTTPS or localhost.');
    await init();
    document.querySelector('#status').remove();
  } catch (error) {
    document.querySelector('#status').textContent = `Could not start the game: ${error.message}`;
    console.error(error);
  }
</script>
</body>
</html>
