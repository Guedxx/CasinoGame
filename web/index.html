<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saldo Zero</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #111310; }
  canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
  #status { position: absolute; z-index: 1; top: 16px; left: 16px; font: 16px system-ui; color: #e8e3d4; }
</style>
<body>
<div id="status" role="status">Loading Saldo Zero</div>
<script data-audio-unlock>
  // Bevy owns the audio contexts; browsers require resume inside a user gesture.
  if (window.AudioContext) {
    const AudioContext = window.AudioContext;
    const contexts = new Set();
    window.AudioContext = class extends AudioContext {
      constructor(...args) {
        super(...args);
        contexts.add(this);
      }
    };
    const unlockAudio = () => {
      for (const context of contexts) {
        if (context.state === 'suspended') {
          context.resume().catch(error => console.warn('Audio could not resume.', error));
        }
      }
    };
    window.addEventListener('pointerdown', unlockAudio, { capture: true, passive: true });
    window.addEventListener('keydown', unlockAudio, { capture: true });
  }
</script>
<script type="module">
  const status = document.querySelector('#status');
  function failed(error) {
    status.hidden = false;
    status.textContent = `Could not start the game: ${error?.message ?? error}`;
    console.error(error);
  }
  window.addEventListener('error', event => failed(event.error ?? event.message));
  window.addEventListener('unhandledrejection', event => failed(event.reason));
  if (navigator.keyboard?.lock) {
    const root = document.documentElement;
    let enteredFullscreen = false;
    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement) {
        enteredFullscreen = false;
        root.removeAttribute('data-game-escape-lock');
        navigator.keyboard.unlock();
      }
    });
    document.addEventListener('pointerlockchange', async () => {
      if (document.pointerLockElement) {
        try {
          // Browsers only let the game keep Escape captured in API fullscreen.
          if (!document.fullscreenElement) {
            await root.requestFullscreen();
            enteredFullscreen = true;
          }
          if (document.pointerLockElement && document.fullscreenElement) {
            await navigator.keyboard.lock(['Escape']);
            if (document.pointerLockElement && document.fullscreenElement) {
              root.setAttribute('data-game-escape-lock', '');
              return;
            }
          }
        } catch (error) {
          console.warn('Escape capture unavailable; browser Escape behavior remains active.', error);
        }
      }
      root.removeAttribute('data-game-escape-lock');
      navigator.keyboard.unlock();
      if (enteredFullscreen && document.fullscreenElement) {
        enteredFullscreen = false;
        await document.exitFullscreen().catch(error => console.warn('Could not leave fullscreen.', error));
      }
    });
  }
  try {
    if (!navigator.gpu) throw new Error('WebGPU is unavailable. Use a WebGPU-enabled browser over HTTPS or localhost.');
    if (!await navigator.gpu.requestAdapter({ powerPreference: 'high-performance' })) {
      throw new Error('No WebGPU graphics device is available. Enable hardware acceleration and WebGPU in your browser, then reload, or use another WebGPU-enabled browser.');
    }
    const build = '__GAME_BUILD__';
    const { default: init } = await import(`./CasinoGame.js?v=${build}`);
    await init({ module_or_path: `./CasinoGame_bg.wasm?v=${build}` });
    status.hidden = true;
  } catch (error) {
    failed(error);
  }
</script>
</body>
</html>
