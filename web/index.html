<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Casino Game — Apartment</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #8cb3d1; }
  canvas { display: block; width: 100%; height: 100%; }
  #status { position: absolute; top: 16px; left: 16px; font: 16px system-ui; color: #142b21; }
</style>
<body>
<div id="status" role="status">Loading apartment…</div>
<script type="module">
  import init from './CasinoGame.js';
  try {
    await init();
    document.querySelector('#status').remove();
  } catch (error) {
    document.querySelector('#status').textContent = `Could not start the game: ${error.message}`;
    console.error(error);
  }
</script>
</body>
</html>
